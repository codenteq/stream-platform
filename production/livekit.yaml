port: 7880

rtc:
    tcp_port: 7882
    port_range_start: 50400
    port_range_end: 50600
    use_external_ip: true
redis:
    address: redis:6379
keys:
    # Replace with your own API key and secret (secret: 32+ random characters, e.g. `openssl rand -base64 32`).
    # Use the same values in egress.yaml and in LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
    replace-with-api-key: replace-with-api-secret-of-at-least-32-chars
logging:
    json: false
    level: info
