version: '3.9'

services:
  caddy:
    image: caddy:alpine
    container_name: stream_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
      - livekit

  db:
    image: postgres:14-alpine
    container_name: stream_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  livekit:
    image: livekit/livekit-server:latest
    container_name: stream_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882"
      - "50400-50600:50400-50600/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    restart: always

  egress:
    image: livekit/egress:latest
    container_name: stream_egress
    entrypoint: ["egress", "--config", "/etc/egress.yaml"]
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    depends_on:
      - livekit
      - redis
    # Egress needs shared memory for Chrome
    shm_size: 2gb
    restart: always

  redis:
    image: redis:alpine
    container_name: stream_redis
    restart: always

  backend:
    image: stream-backend:latest
    container_name: stream_backend
    build: ../backend
    environment:
      - DB_SOURCE=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - LIVEKIT_HOST=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - db
      - livekit
    command: sh -c "sleep 10 && /main"
    restart: always

  frontend:
    image: stream-frontend:latest
    container_name: stream_frontend
    build: ../frontend
    environment:
      - NEXT_PUBLIC_LIVEKIT_WS_URL=wss://stream.codenteq.com
      - NEXT_PUBLIC_APP_URL=https://stream.codenteq.com
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
