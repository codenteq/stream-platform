name: Docker images

# Publishes the backend and frontend images to GitHub Container Registry
# whenever a release is published. It can also be started by hand from
# the Actions tab.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}

jobs:
  image:
    name: ${{ matrix.component }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Release v1.2.3 is tagged 1.2.3, 1.2 and latest (pre-releases get only
      # 1.2.3-rc.1). A manual run is tagged with its branch name, e.g. main.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch

      # The frontend bakes these URLs into the browser bundle at build time.
      # Set them as repository variables to build for another host. The
      # backend image ignores them.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_LIVEKIT_WS_URL=${{ vars.NEXT_PUBLIC_LIVEKIT_WS_URL || 'wss://stream.codenteq.com' }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL || 'https://stream.codenteq.com' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          # Without a provenance attestation each build is a single image
          # manifest, so the registry shows one version per build instead of
          # extra untagged entries.
          provenance: false
