version: '3.9'

services:
  db:
    image: postgres:14-alpine
    container_name: stream_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: stream_livekit
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880" # Media port
      - "7881:7881" # WebRTC port
      - "7882:7882" # TCP port
      - "50400-50600:50400-50600/udp" # WebRTC UDP ports
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    entrypoint: ["egress", "--config", "/etc/egress.yaml"]
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    depends_on:
      - livekit
      - redis
    shm_size: 2gb
    restart: unless-stopped



  redis:
    image: redis:alpine
    container_name: stream_redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: stream_backend
    ports:
      - "8000:8000"
    environment:
      - DB_SOURCE=postgresql://user:password@db:5432/stream_db?sslmode=disable
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=ThisIsAStrongAndSecureSecretKey32
      - JWT_SECRET=my-super-secret-key
    depends_on:
      - db
      - livekit
    command: sh -c "sleep 10 && /main"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Yerel geliştirme: tarayıcı LiveKit'e ve davet linklerine localhost üzerinden erişir
      args:
        NEXT_PUBLIC_LIVEKIT_WS_URL: ws://localhost:7880
        NEXT_PUBLIC_APP_URL: http://localhost:3001
    container_name: stream_frontend
    ports:
      - "3001:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"

